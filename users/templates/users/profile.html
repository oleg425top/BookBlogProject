{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">Мой профиль</h4>
                </div>
                <div class="card-body text-center">
                    <!-- Аватар -->
                    {% if user.image %}
                        <img
                            src="{{ user.image.url }}"
                            alt="Аватар"
                            class="rounded-circle mb-3"
                            style="width: 120px; height: 120px; object-fit: cover; border: 3px solid #0d6efd;"
                        >
                    {% else %}
                        <div class="mb-3">
                            <i class="bi bi-person-circle" style="font-size: 120px; color: #0d6efd;"></i>
                        </div>
                    {% endif %}
                    <!-- Информация о пользователе -->
                    <div class="text-start mb-4">
                        <p class="card-text"><strong>Email:</strong> {{ user.email }}</p>
                        <p class="card-text"><strong>Имя:</strong> {{ user.first_name|default:"Не указано" }}</p>
                        <p class="card-text"><strong>Телефон:</strong> {{ user.phone|default:"Не указано" }}</p>
                    </div>
                    <!-- Кнопки действий -->
                    <div class="d-flex justify-content-center gap-2">
                        <a href="#" class="btn btn-outline-primary">Обновить профиль</a>
                        <a href="#" class="btn btn-outline-success">Изменить пароль</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
